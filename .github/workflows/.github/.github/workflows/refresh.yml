name: Refresh padel availability

on:
  schedule:
    # Every 15 minutes from 5am to 11pm Perth time (21:00 to 15:00 UTC)
    - cron: "*/15 21-23,0-14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check venues
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scraper.py --full
          else
            python scraper.py
          fi
      - name: Save data.json
        run: |
          git config user.name "padel-bot"
          git config user.email "padel-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update availability"
          git pull --rebase
          git push
